# cargo-nextest, for the macOS CI job (.github/workflows/ci.yml): it runs tests from different
# binaries at once, each in its own process. `cargo test` (the local gate) doesn't read this file.

# A failure stays a failure: no retries, and every test runs however many fail.
[profile.ci]
# Twice the macOS runner's 3 cores: most tests wait on a PTY, a socket or a timeout, not the CPU.
# At 3, the 1045 tests' 868 s of running took 335 s.
test-threads = 6
retries = 0
fail-fast = false

# Runs `cargo build --release` on every core (a release leon in its own target dir): it gets the
# machine to itself, as it had under `cargo test`, so tests with deadlines never run beside it.
[[profile.ci.overrides]]
filter = "binary_id(leon::update_release_build)"
threads-required = "num-test-threads"
