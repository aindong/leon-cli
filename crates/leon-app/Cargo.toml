[package]
name = "leon-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
leon-core.workspace = true
leon-hosts.workspace = true
leon-server.workspace = true
leon-lua.workspace = true
alacritty_terminal.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

# The window (GPUI, macOS for now). Without it the crate is the GPUI-free part that `leon attach`
# shares: the client, keymap, palette and pane layout (docs/architecture.md, Platforms).
[features]
default = ["gui"]
gui = ["dep:gpui", "dep:metal", "dep:core-video", "dep:raw-window-handle"]

[target.'cfg(target_os = "macos")'.dependencies]
gpui = { workspace = true, optional = true }
# Leon.app's updates (updates.rs): the same checks and install as `leon self-update`
leon-update.workspace = true
# already in the tree through GPUI; for notifications and the Dock badge (notify_mac.rs)
objc2 = "0.6.5"
block2 = "0.6.2"
# Cursor shaders (cursor_shader/): naga translates the user's GLSL to MSL (also for `leon config
# check`, so not behind `gui`); the overlay draws with Metal on a display link of its own. The
# versions are GPUI's own.
naga = { version = "25", features = ["glsl-in", "msl-out"] }
metal = { version = "0.29", optional = true }
core-video = { version = "0.4.3", optional = true }
raw-window-handle = { version = "0.6", optional = true }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
