<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="leon-token" content="{{token}}">
<title>leon</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<nav id="sidebar" aria-label="Sessions">
  <header><span class="mark" aria-hidden="true"></span>leon <button id="new-session" class="add" title="New session">+ Session</button></header>
  <ul id="sessions"></ul>
  <section id="activity-box" hidden>
    <h2>Activity</h2>
    <ul id="activity"></ul>
  </section>
  <button id="notify" class="add" hidden>Notify me</button>
</nav>
<main id="main">
  <div id="strip">
    <button id="home" title="Home: Activity and the sessions">‹</button>
    <button id="menu" title="Sessions and tabs" aria-expanded="false">☰</button>
    <span id="strip-title"></span>
    <span id="chips"></span>
  </div>
  <p id="note" role="status"></p>
  <div id="panes"></div>
  <div id="keyrow" role="toolbar" aria-label="Keys a phone's keyboard lacks"></div>
  <textarea id="keys" aria-label="Keys to the focused pane" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
</main>
<div id="scrim"></div>
</body>
</html>
