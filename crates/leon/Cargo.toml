[package]
name = "leon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "leon"
path = "src/main.rs"

[dependencies]
leon-core.workspace = true
leon-server.workspace = true
leon-lua.workspace = true
leon-app.workspace = true
leon-hosts.workspace = true
clap.workspace = true
libc.workspace = true
ratatui.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true

# `cargo bench -p leon --bench speed [-- --samples N]`; results in docs/performance.md.
[[bench]]
name = "speed"
harness = false

[dev-dependencies]
alacritty_terminal.workspace = true
gpui = { workspace = true, features = ["test-support"] }
