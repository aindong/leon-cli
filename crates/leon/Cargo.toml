[package]
name = "leon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "leon"
path = "src/main.rs"

[dependencies]
leon-core.workspace = true
leon-server.workspace = true
leon-lua.workspace = true
clap.workspace = true
libc.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true

# The GPUI app (`leon app`, `leon` alone). Cargo has no per-platform default features, so the app is
# a default feature *and* a macOS-only dependency: Linux builds headless with no flag, and
# `--no-default-features` gives a headless macOS build (docs/architecture.md, Platforms).
[features]
default = ["app"]
app = ["dep:leon-app"]

[target.'cfg(target_os = "macos")'.dependencies]
leon-app = { workspace = true, optional = true }

# `cargo bench -p leon --bench speed [-- --samples N]`; results in docs/performance.md.
[[bench]]
name = "speed"
harness = false

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
