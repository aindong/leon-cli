# macOS: the whole gate, app included. Linux (x86_64 and aarch64): the server and CLI in the pinned
# Rust image, the smoke test and the packages (scripts/linux-test.sh, scripts/package-linux.sh).
# A change to English docs alone, or to the website (website/), runs only the tests that read the
# docs, on Linux (the docs job), and the website's build (the site job, which every change runs).
# Actions are pinned by commit, with their tag beside them.
name: CI

# A push to a PR branch is one run (pull_request); a merge into dev or main starts its own. A change
# to nothing but translations, images, brand files and community files starts no run: translations
# have scripts/i18n-check.sh, and the tests that read images, brand files or the README's links to
# the community files run in the next run that starts.
# scripts/ci-changes.sh keeps the same list.
on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "docs/i18n/**"
      - "docs/images/**"
      - "brand/**"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  pull_request:
    paths-ignore:
      - "docs/i18n/**"
      - "docs/images/**"
      - "brand/**"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"

# A newer push cancels the PR's older run. A run on main or dev is alone in its group (its run id):
# a shared group would cancel the one waiting when a third arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # What the change needs (scripts/ci-changes.sh): English docs alone run only the doc tests, on
  # Linux; anything else, the whole gate below. Plain git diff rather than a third-party action:
  # a few lines, and no more code that sees the token. A PR's checkout is its merge commit, whose
  # first parent is the branch it merges into; a push compares with the commit before it.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      kind: ${{ steps.kind.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: kind
        env:
          BEFORE: ${{ github.event.before }}
        # a push's previous commit may be missing (a new branch): the diff fails and it says full
        run: |
          base=HEAD^1
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            base=$BEFORE
            git fetch -q --depth=1 origin "$base" || true
          fi
          kind=$(scripts/ci-changes.sh "$base") # a failure here fails the run, never skips the jobs
          echo "kind=$kind" | tee -a "$GITHUB_OUTPUT"

  macos:
    needs: changes
    if: needs.changes.outputs.kind == 'full'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-11
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: brew install minisign # the release tests sign with a throwaway key
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # cargo-nextest runs the test binaries in parallel (.config/nextest.toml): one exact release
      # from its fixed URL, checked against its sha256 before it is unpacked
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/nextest.tar.gz" https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.150/cargo-nextest-0.9.150-universal-apple-darwin.tar.gz
          echo "82a759b4d218d38359424196ab244c470e8f7c7d149c814fbbeef4d67c3c301a  $RUNNER_TEMP/nextest.tar.gz" | shasum -a 256 -c
          mkdir "$RUNNER_TEMP/nextest"
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$RUNNER_TEMP/nextest"
          echo "$RUNNER_TEMP/nextest" >> "$GITHUB_PATH"
      - run: cargo nextest run --profile ci --workspace
      # nextest doesn't run doc-tests; they run even when a test above failed, as under cargo test
      - if: ${{ !cancelled() }}
        run: cargo test --doc --no-fail-fast

  linux:
    needs: changes
    if: needs.changes.outputs.kind == 'full'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/linux-test.sh
      - run: scripts/package-linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leon-linux-${{ matrix.runner }}
          path: |
            target/linux/*/*.tar.gz
            target/linux/*/*.deb

  # English docs alone: the tests that read them, in the linux job's pinned image (zsh, minisign
  # and jq are there), and the translations' check, which reads the history their headers name.
  docs:
    needs: changes
    if: needs.changes.outputs.kind == 'docs'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: scripts/i18n-check.sh
      - run: scripts/linux-doc-tests.sh

  # The website (website/), as site.yml deploys it: built strictly, so a broken link or anchor fails
  # here rather than at a release, and its tests. On any change but translations and brand files
  # alone, docs or code, since both can break a link; a minute on Linux. The history, for the test
  # that builds the latest release's tag.
  site:
    needs: changes
    if: needs.changes.outputs.kind != 'none'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: website/build.sh
      - run: target/site-venv/bin/python website/test_site.py
