# macOS: the whole gate, app included. Linux (x86_64 and aarch64): the server and CLI in the pinned
# Rust image, the smoke test and the packages (scripts/linux-test.sh, scripts/package-linux.sh).
# Actions are pinned by commit, with their tag beside them.
name: CI

# A push to a PR branch is one run (pull_request); a merge into dev or main starts its own.
on:
  push:
    branches: [main, dev]
  pull_request:

# A newer push cancels the PR's older run. A run on main or dev is alone in its group (its run id):
# a shared group would cancel the one waiting when a third arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-11
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: brew install minisign # the release tests sign with a throwaway key
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # cargo-nextest runs the test binaries in parallel (.config/nextest.toml): one exact release
      # from its fixed URL, checked against its sha256 before it is unpacked
      - run: |
          curl -fsSL -o "$RUNNER_TEMP/nextest.tar.gz" https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.150/cargo-nextest-0.9.150-universal-apple-darwin.tar.gz
          echo "82a759b4d218d38359424196ab244c470e8f7c7d149c814fbbeef4d67c3c301a  $RUNNER_TEMP/nextest.tar.gz" | shasum -a 256 -c
          mkdir "$RUNNER_TEMP/nextest"
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$RUNNER_TEMP/nextest"
          echo "$RUNNER_TEMP/nextest" >> "$GITHUB_PATH"
      - run: cargo nextest run --profile ci --workspace
      # nextest doesn't run doc-tests; they run even when a test above failed, as under cargo test
      - if: ${{ !cancelled() }}
        run: cargo test --doc --no-fail-fast

  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/linux-test.sh
      - run: scripts/package-linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: leon-linux-${{ matrix.runner }}
          path: |
            target/linux/*/*.tar.gz
            target/linux/*/*.deb
