name: Feature request
description: An idea for leon.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work, from the command line, the app, Lua or an agent.
    validations:
      required: true
  - type: textarea
    id: else
    attributes:
      label: Other ways you considered
  - type: checkboxes
    id: help
    attributes:
      label: Helping
      options:
        - label: I'd like to work on this myself.
