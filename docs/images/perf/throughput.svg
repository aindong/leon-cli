<svg xmlns="http://www.w3.org/2000/svg" width="720" height="422" viewBox="0 0 720 422" role="img" aria-labelledby="title desc">
<title id="title">cat of 100 MB, run by run, at each step</title>
<desc id="desc">cat throughput at each step from the reader thread to scrollback B: with each change leon's runs sit near the macOS PTY's own limit of about 115 MB/s; the runs far below it were on a loaded machine.</desc>
<style>
  .bg { fill: #fcfcfb; } .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; }
  .grid { stroke: #e7e6e2; } .axis { stroke: #b9b8b1; } .ref { stroke: #52514e; }
  .c1 { fill: #2a78d6; stroke: #2a78d6; } .c2 { fill: #eb6834; stroke: #eb6834; } .c0 { fill: #8f8d86; stroke: #8f8d86; }
  .ring { stroke: #fcfcfb; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .t1 { fill: #f0efec; } .t2 { fill: #c3c2b7; }
    .grid { stroke: #2f2f2c; } .axis { stroke: #57564f; } .ref { stroke: #c3c2b7; }
    .c1 { fill: #3987e5; stroke: #3987e5; } .c2 { fill: #d95926; stroke: #d95926; } .c0 { fill: #76756f; stroke: #76756f; }
    .ring { stroke: #1a1a19; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
</style>
<rect class="bg" width="720" height="422" rx="8"/>
<text x="24.0" y="32.0" class="t1" font-size="16" text-anchor="start" font-weight="600">cat of 100 MB, run by run, at each step</text>
<text x="24.0" y="52.0" class="t2" font-size="12" text-anchor="start">Each dot is one run of cargo bench's speed bench: cat of 100 MB, MB/s of program output.</text>
<text x="24.0" y="69.0" class="t2" font-size="12" text-anchor="start">Apple M6, release build. The runs far below the rest were on a busy machine (load 7 to 18).</text>
<line x1="204.0" y1="124.0" x2="204.0" y2="372.0" class="axis" stroke-width="1"/>
<text x="204.0" y="388.0" class="t2" font-size="11" text-anchor="middle">0</text>
<line x1="282.7" y1="124.0" x2="282.7" y2="372.0" class="grid" stroke-width="1"/>
<text x="282.7" y="388.0" class="t2" font-size="11" text-anchor="middle">25</text>
<line x1="361.3" y1="124.0" x2="361.3" y2="372.0" class="grid" stroke-width="1"/>
<text x="361.3" y="388.0" class="t2" font-size="11" text-anchor="middle">50</text>
<line x1="440.0" y1="124.0" x2="440.0" y2="372.0" class="grid" stroke-width="1"/>
<text x="440.0" y="388.0" class="t2" font-size="11" text-anchor="middle">75</text>
<line x1="518.7" y1="124.0" x2="518.7" y2="372.0" class="grid" stroke-width="1"/>
<text x="518.7" y="388.0" class="t2" font-size="11" text-anchor="middle">100</text>
<line x1="597.3" y1="124.0" x2="597.3" y2="372.0" class="grid" stroke-width="1"/>
<text x="597.3" y="388.0" class="t2" font-size="11" text-anchor="middle">125</text>
<line x1="676.0" y1="124.0" x2="676.0" y2="372.0" class="grid" stroke-width="1"/>
<text x="676.0" y="388.0" class="t2" font-size="11" text-anchor="middle">150</text>
<text x="440.0" y="406.0" class="t2" font-size="12" text-anchor="middle">MB/s</text>
<line x1="565.9" y1="118.0" x2="565.9" y2="372.0" class="ref" stroke-width="1" stroke-dasharray="4 3"/>
<text x="561.9" y="116.0" class="t2" font-size="11" text-anchor="end">the macOS PTY's own limit, about 115</text>
