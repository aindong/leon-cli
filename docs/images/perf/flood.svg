<path class="c0" d="M71.0 160.0h359.0a3.0 3.0 0 0 1 3.0 3.0v8.0a3.0 3.0 0 0 1 -3.0 3.0h-359.0z"/>
<text x="439.0" y="171.0" class="t1" font-size="11" text-anchor="start">79.7 MB/s</text>
<path class="c1" d="M71.0 176.0h515.7a3.0 3.0 0 0 1 3.0 3.0v8.0a3.0 3.0 0 0 1 -3.0 3.0h-515.7z"/>
<text x="595.7" y="187.0" class="t1" font-size="11" text-anchor="start">114.2 MB/s</text>
