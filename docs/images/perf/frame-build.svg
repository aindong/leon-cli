<svg xmlns="http://www.w3.org/2000/svg" width="720" height="238" viewBox="0 0 720 238" role="img" aria-labelledby="title desc">
<title id="title">Frame build time, p50</title>
<desc id="desc">Frame build at p50: 1.0 ms with one pane, 1.4 ms with 8 and 5.1 ms with 100 printing, all inside one 60 Hz frame of 16.7 ms.</desc>
<style>
  .bg { fill: #fcfcfb; } .t1 { fill: #0b0b0b; } .t2 { fill: #52514e; }
  .grid { stroke: #e7e6e2; } .axis { stroke: #b9b8b1; } .ref { stroke: #52514e; }
  .c1 { fill: #2a78d6; stroke: #2a78d6; } .c2 { fill: #eb6834; stroke: #eb6834; } .c0 { fill: #8f8d86; stroke: #8f8d86; }
  .ring { stroke: #fcfcfb; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; } .t1 { fill: #f0efec; } .t2 { fill: #c3c2b7; }
    .grid { stroke: #2f2f2c; } .axis { stroke: #57564f; } .ref { stroke: #c3c2b7; }
    .c1 { fill: #3987e5; stroke: #3987e5; } .c2 { fill: #d95926; stroke: #d95926; } .c0 { fill: #76756f; stroke: #76756f; }
    .ring { stroke: #1a1a19; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
</style>
<rect class="bg" width="720" height="238" rx="8"/>
<text x="24.0" y="32.0" class="t1" font-size="16" text-anchor="start" font-weight="600">Frame build time, p50</text>
<text x="24.0" y="52.0" class="t2" font-size="12" text-anchor="start">How long the app takes to build a frame at p50 while every pane prints.</text>
<text x="24.0" y="69.0" class="t2" font-size="12" text-anchor="start">60 Hz display, release build.</text>
<line x1="176.0" y1="102.0" x2="176.0" y2="188.0" class="axis" stroke-width="1"/>
<text x="176.0" y="204.0" class="t2" font-size="11" text-anchor="middle">0</text>
<line x1="286.0" y1="102.0" x2="286.0" y2="188.0" class="grid" stroke-width="1"/>
<text x="286.0" y="204.0" class="t2" font-size="11" text-anchor="middle">5</text>
<line x1="396.0" y1="102.0" x2="396.0" y2="188.0" class="grid" stroke-width="1"/>
<text x="396.0" y="204.0" class="t2" font-size="11" text-anchor="middle">10</text>
<line x1="506.0" y1="102.0" x2="506.0" y2="188.0" class="grid" stroke-width="1"/>
<text x="506.0" y="204.0" class="t2" font-size="11" text-anchor="middle">15</text>
<line x1="616.0" y1="102.0" x2="616.0" y2="188.0" class="grid" stroke-width="1"/>
<text x="616.0" y="204.0" class="t2" font-size="11" text-anchor="middle">20</text>
<text x="396.0" y="222.0" class="t2" font-size="12" text-anchor="middle">milliseconds</text>
<line x1="543.4" y1="96.0" x2="543.4" y2="188.0" class="ref" stroke-width="1" stroke-dasharray="4 3"/>
<text x="547.4" y="94.0" class="t2" font-size="11" text-anchor="start">one 60 Hz frame</text>
<text x="166.0" y="119.0" class="t1" font-size="12" text-anchor="end">1 pane (flood.sh)</text>
<path class="c1" d="M176.0 108.0h19.0a3.0 3.0 0 0 1 3.0 3.0v8.0a3.0 3.0 0 0 1 -3.0 3.0h-19.0z"/>
<text x="204.0" y="119.0" class="t1" font-size="11" text-anchor="start">1.0 ms</text>
<text x="166.0" y="147.0" class="t1" font-size="12" text-anchor="end">8 panes (flood.sh)</text>
<path class="c1" d="M176.0 136.0h27.8a3.0 3.0 0 0 1 3.0 3.0v8.0a3.0 3.0 0 0 1 -3.0 3.0h-27.8z"/>
<text x="212.8" y="147.0" class="t1" font-size="11" text-anchor="start">1.4 ms</text>
<text x="166.0" y="175.0" class="t1" font-size="12" text-anchor="end">100 panes (scale.sh)</text>
<path class="c1" d="M176.0 164.0h109.2a3.0 3.0 0 0 1 3.0 3.0v8.0a3.0 3.0 0 0 1 -3.0 3.0h-109.2z"/>
<text x="294.2" y="175.0" class="t1" font-size="11" text-anchor="start">5.1 ms</text>
</svg>
