<svg xmlns="http://www.w3.org/2000/svg" width="720" height="308" viewBox="0 0 720 308" role="img" aria-labelledby="title desc">
<title id="title">Key to echo, before and after the GPUI refactor</title>
<desc id="desc">Key to echo painted before and after GPUI refactor phases 5 to 7, in a VM: the same within the runs' spread, idle 26.0 against 28.3 ms, one pane flooding 17.5 against 20.8 ms, eight panes busy 18.0 against 18.0 ms.</desc>
<style>
