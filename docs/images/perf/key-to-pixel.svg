<text x="489.6" y="361.0" class="t1" font-size="11" text-anchor="start">51.9 ms</text>
<path class="c2" d="M239.0 366.0h335.4a3.0 3.0 0 0 1 3.0 3.0v8.0a3.0 3.0 0 0 1 -3.0 3.0h-335.4z"/>
