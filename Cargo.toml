[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
leon-core = { path = "crates/leon-core" }
leon-server = { path = "crates/leon-server" }
leon-lua = { path = "crates/leon-lua" }
alacritty_terminal = "0.26"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
libc = "0.2"
mlua = { version = "0.12", features = ["lua51", "vendored", "serialize"] }
portable-pty = "0.9"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: saved split ratios must parse back bit for bit (persist.rs).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
