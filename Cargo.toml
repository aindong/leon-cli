[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
leon-core = { path = "crates/leon-core" }
leon-server = { path = "crates/leon-server" }
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
libc = "0.2"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
