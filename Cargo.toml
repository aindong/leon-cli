[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
leon-core = { path = "crates/leon-core" }
leon-server = { path = "crates/leon-server" }
leon-lua = { path = "crates/leon-lua" }
# default-features off so `leon` can take its GPUI-free modules on Linux (the `gui` feature)
leon-app = { path = "crates/leon-app", default-features = false }
leon-hosts = { path = "crates/leon-hosts" }
alacritty_terminal = "0.26"
base64 = "0.22"
# runtime_shaders: builds without the Metal Toolchain (docs/architecture.md).
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
# futures: the app awaits the reader thread's wake-ups (already in the tree through gpui).
futures = "0.3"
clap = { version = "4.6", features = ["derive", "env"] }
libc = "0.2"
mlua = { version = "0.12", features = ["lua51", "vendored", "serialize"] }
portable-pty = "0.9"
# leon attach (M17): crossterm 0.29 comes through ratatui::crossterm, so the two agree.
# regex-syntax: escapes a plain find query for alacritty's regex search (already in the tree through it).
regex-syntax = "0.8"
# regex: hint patterns (M19), the config's included (already in the tree at 1.13).
regex = "1.13"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: saved split ratios must parse back bit for bit (persist.rs).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
