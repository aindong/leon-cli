[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
leon-core = { path = "crates/leon-core" }
leon-server = { path = "crates/leon-server" }
leon-lua = { path = "crates/leon-lua" }
# default-features off so `leon` can take its GPUI-free modules on Linux (the `gui` feature)
leon-app = { path = "crates/leon-app", default-features = false }
leon-hosts = { path = "crates/leon-hosts" }
leon-update = { path = "crates/leon-update" }
alacritty_terminal = "0.26"
base64 = "0.22"
# runtime_shaders: builds without the Metal Toolchain (docs/architecture.md).
gpui = { version = "0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
# futures: the app awaits the reader thread's wake-ups (already in the tree through gpui).
futures = "0.3"
clap = { version = "4.6", features = ["derive", "env"] }
libc = "0.2"
# memchr: the parse path's search for ESC and newlines (already in the tree through regex).
memchr = "2"
mlua = { version = "0.12", features = ["lua51", "vendored", "serialize"] }
portable-pty = "0.9"
# leon attach (M17): crossterm 0.29 comes through ratatui::crossterm, so the two agree.
# regex-syntax: escapes a plain find query for alacritty's regex search (already in the tree through it).
regex-syntax = "0.8"
# regex: hint patterns (M19), the config's included (already in the tree at 1.13).
regex = "1.13"
# roxmltree: reads iTerm2 .itermcolors plists (already in the tree through gpui's usvg).
roxmltree = "0.20"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: saved split ratios must parse back bit for bit (persist.rs).
# HTTPS for the web page (crates/leon-server/src/web_tls.rs): rustls with ring, already in the tree
# through GPUI's HTTP client, and only a C compiler to build (aws-lc-rs would need cmake and NASM).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# rustls-webpki: only to say which name a certificate covers (no crypto of its own used).
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
# sha1_smol: the WebSocket handshake (crates/leon-server/src/websocket.rs); no dependencies of its own.
sha1_smol = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
# The updater (crates/leon-update): minisign signatures, sha256 sums, version order, and the two
# archive formats a release has. zip: deflate only, and only on macOS, which alone has the app.
flate2 = "1.1"
minisign-verify = "0.3"
semver = "1"
sha2 = "0.10"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

# The updater hashes and unpacks whole release files, and its end-to-end tests do that to a real
# leon: unoptimized, each takes most of a minute.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.minisign-verify]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3

# GPUI 0.2.2 plus one display-link fix (docs/architecture/gpui-patch.md; ADR R11 as amended)
[patch.crates-io]
gpui = { git = "https://github.com/aindong/gpui", rev = "24807306dcc0c90072c4cfa80e1da3f6f11228b8" }
